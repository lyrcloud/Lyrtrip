AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lyrtrip static frontend on S3/CloudFront with Lambda API and Route 53 alias.

Parameters:
  DomainName:
    Type: String
    Description: Fully qualified domain name, for example lyrtrip.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for DomainName. Leave blank if DNS is managed outside Route 53.
  EnableRoute53:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Whether the deployment should create a Route 53 record for the domain.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: Optional existing ACM certificate ARN in us-east-1. Required when DNS is managed outside Route 53.
  FunctionName:
    Type: String
    Default: Lyrtrip
    Description: Lambda function name for the Lyrtrip API.
  MongoDbUri:
    Type: String
    NoEcho: true
    Default: ""
    Description: MongoDB Atlas connection string for the Lambda API.
  MongoDbName:
    Type: String
    Default: lyrtrip
    Description: MongoDB database name.
  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito User Pool ID used to verify API JWTs.
  CognitoUserPoolClientId:
    Type: String
    Default: ""
    Description: Cognito app client ID used to verify API JWTs.
  WeChatAppId:
    Type: String
    Default: ""
    Description: WeChat Open Platform website app ID, used to exchange WeChat login codes.
  WeChatAppSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: WeChat Open Platform website app secret.
  WeChatAuthSharedSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Random shared secret used to bridge WeChat sign-in into a Cognito CUSTOM_AUTH challenge.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe secret key (sk_live_... or sk_test_...) used by the checkout Lambda.
  UberServerToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Uber server token (V4Pv32...) for price-estimates API (no OAuth required).
  UberClientId:
    Type: String
    Default: "xuJjFMaEj4AfL-2TP-ql-6bKkA8sMPAB"
    Description: Uber OAuth client ID used to build deep-links.
  DuffelApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Duffel API key (duffel_test_... or duffel_live_...) for flight search and booking.
  SesFromEmail:
    Type: String
    Default: ""
    Description: Verified SES sender address for flight e-ticket emails (e.g. tickets@lyrtrip.com).
  TravelportUsername:
    Type: String
    Default: ""
    Description: Travelport TripServices username (e.g. TP12345678).
  TravelportPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Travelport TripServices password.
  TravelportClientId:
    Type: String
    Default: ""
    Description: Travelport OAuth client ID.
  TravelportClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Travelport OAuth client secret.
  TravelportAccessGroup:
    Type: String
    Default: ""
    Description: Travelport access group GUID (XAUTH_TRAVELPORT_ACCESSGROUP header value).
  TravelportAirMarkup:
    Type: String
    Default: "1.08"
    Description: Multiplier applied to the Travelport air total fare incl. taxes (1.08 = 8% commission).
  TravelportHotelMarkup:
    Type: String
    Default: "1.12"
    Description: Multiplier applied to Travelport hotel base rate (1.12 = 12% commission).

Conditions:
  UseRoute53:
    Fn::Equals:
      - !Ref EnableRoute53
      - "true"
  UseExistingCertificate:
    Fn::Not:
      - Fn::Equals:
          - !Ref AcmCertificateArn
          - ""
  CreateCertificate:
    Fn::And:
      - Fn::Equals:
          - !Ref AcmCertificateArn
          - ""
      - Fn::Equals:
          - !Ref EnableRoute53
          - "true"

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
                AWS:SourceAccount: !Ref AWS::AccountId

  Certificate:
    Condition: CreateCertificate
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs22.x
      Handler: search.handler
      CodeUri: lambda/
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClientId
          WECHAT_APP_ID: !Ref WeChatAppId
          WECHAT_APP_SECRET: !Ref WeChatAppSecret
          WECHAT_AUTH_SHARED_SECRET: !Ref WeChatAuthSharedSecret
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          UBER_SERVER_TOKEN: !Ref UberServerToken
          UBER_CLIENT_ID: !Ref UberClientId
          DUFFEL_API_KEY: !Ref DuffelApiKey
          SES_FROM_EMAIL: !Ref SesFromEmail
          TRAVELPORT_USERNAME: !Ref TravelportUsername
          TRAVELPORT_PASSWORD: !Ref TravelportPassword
          TRAVELPORT_CLIENT_ID: !Ref TravelportClientId
          TRAVELPORT_CLIENT_SECRET: !Ref TravelportClientSecret
          TRAVELPORT_ACCESS_GROUP: !Ref TravelportAccessGroup
          TRAVELPORT_AIR_MARKUP: !Ref TravelportAirMarkup
          TRAVELPORT_HOTEL_MARKUP: !Ref TravelportHotelMarkup
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminRespondToAuthChallenge
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  AuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${FunctionName}-wechat-auth-challenge'
      Runtime: nodejs22.x
      Handler: auth-challenge.handler
      CodeUri: lambda/
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          WECHAT_AUTH_SHARED_SECRET: !Ref WeChatAuthSharedSecret
      Policies:
        - AWSLambdaBasicExecutionRole

  AuthChallengeFunctionCognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      Cors:
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
        AllowOrigins:
          - '*'

  ApiFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiFunction
      Principal: '*'
      FunctionUrlAuthType: NONE

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          Fn::If:
            - UseExistingCertificate
            - AcmCertificateArn: !Ref AcmCertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - AcmCertificateArn: !Ref Certificate
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
          - Id: lambda-api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: lambda-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  DnsRecord:
    Condition: UseRoute53
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  AuthChallengeFunctionArn:
    Value: !GetAtt AuthChallengeFunction.Arn
    Description: Attach this to the Cognito User Pool's DefineAuthChallenge/CreateAuthChallenge/VerifyAuthChallengeResponse triggers (see SETUP_GUIDE.md).
